<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friar — a DLMM for Robinhood Chain</title>
    <meta
      name="description"
      content="Friar is a DLMM — Dynamic Liquidity Market Maker — for Robinhood Chain. Concentrated liquidity in bins, with a fee that surges through volatility and decays back down. Spot, Curve and Bid-Ask shapes."
    />
    <link rel="canonical" href="https://friar.fi/" />
    <meta name="theme-color" content="#100c07" />

    <!-- icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Friar" />
    <meta property="og:url" content="https://friar.fi/" />
    <meta property="og:title" content="Friar — a DLMM for Robinhood Chain" />
    <meta property="og:description" content="A DLMM for Robinhood Chain — concentrated liquidity in bins, with a fee that surges through volatility and decays back down." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Friar — a DLMM for Robinhood Chain" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Friar — a DLMM for Robinhood Chain" />
    <meta name="twitter:description" content="A DLMM for Robinhood Chain — concentrated liquidity in bins, with a fee that surges through volatility and decays back down." />
    <meta name="twitter:image" content="https://friar.fi/og.png?v=3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        --bg: #100c07;
        --panel: #181209;
        --border: #2a2012;
        --border-hover: #463620;
        --text: #ece3d2;
        --dim: #8a7a5f;
        --faint: #5d5138;
        --accent: #cf9440;
        --accent-hover: #ddaa5c;
        --on-accent: #171006;
        --green: #8fbf5f;
        --red: #e05d52;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      a { color: inherit; text-decoration: none; }

      /* faint background grain of bins */
      .bg-bins {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0.5;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 42%, #000 30%, transparent 78%);
        mask-image: radial-gradient(ellipse 90% 70% at 50% 42%, #000 30%, transparent 78%);
      }

      header.top {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 28px;
      }
      .brand {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: var(--accent);
        font-size: 15px;
      }
      .top .links { display: flex; gap: 20px; align-items: center; }
      .top .links a {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--dim);
      }
      .top .links a:hover { color: var(--text); }

      main {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 24px 60px;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 26px;
      }
      .eyebrow .dot {
        display: inline-block;
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--green); margin-right: 8px;
        vertical-align: middle;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

      h1.word {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        letter-spacing: 0.3em;
        color: var(--accent);
        font-size: clamp(52px, 12vw, 132px);
        margin: 0 0 4px;
        text-indent: 0.3em; /* optical: center despite letter-spacing */
      }
      .tagline {
        font-size: clamp(17px, 2.5vw, 23px);
        color: var(--text);
        max-width: 620px;
        line-height: 1.45;
        margin: 18px auto 0;
        font-weight: 400;
      }
      .tagline b { color: var(--accent); font-weight: 500; }
      .sub {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: var(--dim);
        margin-top: 16px;
      }

      /* animated liquidity shape — bins morphing between Bid-Ask / Spot / Curve */
      .shapes {
        margin: 42px auto 6px;
        width: min(560px, 92vw);
      }
      .shapes svg { width: 100%; height: 96px; display: block; }
      .shape-names {
        display: flex; justify-content: center; gap: 24px; margin-top: 16px;
        font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--faint);
      }
      .shape-names span { letter-spacing: 0.04em; transition: color 0.45s ease; }
      .shape-names span.active { color: var(--accent); }

      .cta-row { margin-top: 40px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .btn-gold {
        font-family: "IBM Plex Sans", sans-serif;
        font-weight: 600;
        font-size: 15px;
        color: var(--on-accent);
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 13px 24px;
        transition: background 0.15s;
      }
      .btn-gold:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      .btn-ghost {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: var(--dim);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 13px 18px;
      }
      .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }

      /* three credibility points */
      .points {
        position: relative; z-index: 2;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--border);
        border-top: 1px solid var(--border);
      }
      .point {
        background: var(--bg);
        padding: 30px 32px;
      }
      .point h3 {
        font-size: 15px; font-weight: 600; margin: 0 0 8px; color: var(--text);
      }
      .point p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--dim); }
      .point .k {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--accent); display: block; margin-bottom: 12px;
      }

      footer {
        position: relative; z-index: 2;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap;
        padding: 22px 28px;
        border-top: 1px solid var(--border);
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px; color: var(--faint);
      }
      footer a:hover { color: var(--dim); }

      @media (max-width: 720px) {
        .points { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <!-- faint bin field behind the hero -->
    <svg class="bg-bins" preserveAspectRatio="none" viewBox="0 0 1200 800" aria-hidden="true"></svg>

    <header class="top">
      <span class="brand">FRIAR</span>
      <nav class="links">
        <a href="/docs/">Documentation</a>
        <a href="https://discord.gg/wCjfVcq9C" target="_blank" rel="noreferrer">Discord</a>
        <a href="https://app.friar.fi?ref=site">Launch app →</a>
      </nav>
    </header>

    <main>
      <div class="eyebrow"><span class="dot"></span>open beta · no invite needed</div>
      <h1 class="word">FRIAR</h1>
      <p class="tagline">A <b>DLMM</b> for Robinhood Chain</p>

      <!-- animated liquidity shape: bins cycling Bid-Ask → Spot → Curve -->
      <div class="shapes">
        <svg id="binSvg" viewBox="0 0 560 96" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="shape-names">
          <span data-shape="bidask">Bid-Ask</span>
          <span data-shape="spot">Spot</span>
          <span data-shape="curve">Curve</span>
        </div>
      </div>

      <div class="cta-row">
        <!-- ?ref= is read once at app boot into the funnel table, so we can tell which
             surface actually sends people (the 07-24 launch had no way to know) -->
        <a class="btn-gold" href="https://app.friar.fi?ref=site">Launch app →</a>
        <!-- the low-commitment path: most visitors aren't ready to connect a wallet, and
             the docs are the only thing on this domain that explains what a DLMM is.
             Discord lives in the nav + the app, so it doesn't need a button here. -->
        <a class="btn-ghost" href="/docs/">Read the docs</a>
      </div>
    </main>

    <footer>
      <span>Sick Labs · Robinhood Chain (4663)</span>
    </footer>

    <script>
      // faint bin field: a bid-ask distribution rendered once behind the hero
      (function () {
        const svg = document.querySelector(".bg-bins");
        const W = 1200, H = 800, n = 46, pad = 40;
        const bw = (W - pad * 2) / n;
        const center = (n - 1) / 2;
        let out = "";
        for (let i = 0; i < n; i++) {
          const f = 0.14 + 0.86 * Math.pow(Math.abs(i - center) / center, 1.5); // bid-ask U
          const h = 40 + f * 300;
          const x = pad + i * bw;
          const side = i < center ? "rgba(207,148,64,0.10)" : "rgba(143,191,95,0.09)";
          out += `<rect x="${x.toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${h.toFixed(1)}" fill="${side}"/>`;
        }
        svg.innerHTML = out;
      })();

      // animated liquidity distribution: rectangular bins morphing between the three
      // DLMM shapes (Bid-Ask edges, Spot flat, Curve center), gold bids / green asks /
      // parchment active bin. The product's core vocabulary, in motion.
      (function () {
        const NS = "http://www.w3.org/2000/svg";
        const svg = document.getElementById("binSvg");
        const names = Array.from(document.querySelectorAll(".shape-names span"));
        const W = 560, H = 96, N = 25, gap = 3;
        const bw = (W - (N - 1) * gap) / N;
        const c = (N - 1) / 2;
        const shapes = ["bidask", "spot", "curve"];

        function target(shape, i) {
          if (shape === "spot") return 0.6;
          if (shape === "curve") return 0.12 + 0.88 * Math.exp(-Math.pow((i - c) / (N * 0.24), 2));
          return 0.16 + 0.84 * Math.pow(Math.abs(i - c) / c, 1.4); // bid-ask
        }

        const rects = [];
        for (let i = 0; i < N; i++) {
          const r = document.createElementNS(NS, "rect");
          r.setAttribute("x", (i * (bw + gap)).toFixed(1));
          r.setAttribute("width", bw.toFixed(1));
          r.setAttribute("rx", "1.5");
          r.setAttribute(
            "fill",
            i < Math.floor(c) ? "rgba(207,148,64,0.85)" : i > Math.ceil(c) ? "rgba(143,191,95,0.8)" : "#ece3d2",
          );
          svg.appendChild(r);
          rects.push(r);
        }

        let heights = rects.map((_, i) => target("bidask", i));
        let si = 0, frames = 0;
        const HOLD_FRAMES = 156; // ~2.6s at 60fps — frame-count based so it advances in any browser
        function setActive() { names.forEach((n) => n.classList.toggle("active", n.dataset.shape === shapes[si])); }
        function frame() {
          if (++frames % HOLD_FRAMES === 0) { si = (si + 1) % shapes.length; setActive(); }
          const shape = shapes[si];
          for (let i = 0; i < N; i++) {
            heights[i] += (target(shape, i) - heights[i]) * 0.09; // ease toward target each frame
            const h = Math.max(2.5, heights[i] * (H - 6));
            rects[i].setAttribute("y", (H - h).toFixed(1));
            rects[i].setAttribute("height", h.toFixed(1));
          }
          requestAnimationFrame(frame);
        }
        setActive();
        requestAnimationFrame(frame);
      })();
    </script>
    <!-- shared with /docs/* (injected by build-docs.mjs) so the landing page and the guide
         report the same way. Kept external rather than inlined twice so there is one copy. -->
    <script src="/beacon.js" defer></script>
  </body>
</html>
