  <!-- the parameters that produced this curve -->
  <text x="64" y="782" text-anchor="start" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#5d5138">standard hook · baseFactor 5000 · filterPeriod 10s · decayPeriod 600s · reductionFactor 50% · variableFeeControl 40000 · cap 10%</text>
  <text x="64" y="808" text-anchor="start" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#5d5138">base fee = baseFactor × tickSpacing, so 0.80% at the 160 spacing this curve uses</text>

