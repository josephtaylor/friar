  <circle cx="458.0" cy="300.0" r="6" fill="#cf9440"/>
  <text x="479.9733333333333" y="334" text-anchor="start" font-family="IBM Plex Mono" font-size="19" font-weight="400" fill="#ece3d2">price runs → fee hits the 10% cap</text>
  <text x="808.0222222222222" y="610.8" text-anchor="start" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#8a7a5f">each quiet swap halves the surge</text>

