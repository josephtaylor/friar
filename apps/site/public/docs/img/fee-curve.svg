  <text x="64" y="78" text-anchor="start" font-family="IBM Plex Mono" font-size="32" font-weight="600" fill="#cf9440" letter-spacing="9">FRIAR</text>
  <text x="1536" y="76" text-anchor="end" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#8a7a5f" letter-spacing="3">THE DYNAMIC FEE</text>
  <line x1="64" y1="108" x2="1536" y2="108" stroke="#2a2012"/>
  <text x="64" y="172" text-anchor="start" font-family="IBM Plex Sans" font-size="46" font-weight="600" fill="#ece3d2">The fee reprices on every swap</text>
  <text x="64" y="214" text-anchor="start" font-family="IBM Plex Sans" font-size="21" font-weight="400" fill="#8a7a5f">Low while the market is calm, climbing with how far price has just moved, decaying back when it</text>
  <text x="64" y="242" text-anchor="start" font-family="IBM Plex Sans" font-size="21" font-weight="400" fill="#8a7a5f">stops. The dashed line marks 1%, a common static fee tier, for scale.</text>

