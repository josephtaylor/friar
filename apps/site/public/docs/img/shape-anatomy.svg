(143,191,95,0.8)"/><rect x="792.8" y="381.9" width="5.4" height="128.1" fill="rgba(143,191,95,0.8)"/><rect x="799.4" y="386.1" width="5.4" height="123.9" fill="rgba(143,191,95,0.8)"/><rect x="806.0" y="388.2" width="5.4" height="121.8" fill="rgba(143,191,95,0.8)"/><rect x="812.6" y="392.4" width="5.4" height="117.6" fill="rgba(143,191,95,0.8)"/><rect x="819.2" y="396.6" width="5.4" height="113.4" fill="rgba(143,191,95,0.8)"/><rect x="825.8" y="398.7" width="5.4" height="111.3" fill="rgba(143,191,95,0.8)"/><rect x="832.4" y="402.9" width="5.4" height="107.1" fill="rgba(143,191,95,0.8)"/><rect x="838.9" y="407.1" width="5.4" height="102.9" fill="rgba(143,191,95,0.8)"/><rect x="845.5" y="411.3" width="5.4" height="98.7" fill="rgba(143,191,95,0.8)"/><rect x="852.1" y="413.4" width="5.4" height="96.6" fill="rgba(143,191,95,0.8)"/><rect x="858.7" y="417.6" width="5.4" height="92.4" fill="rgba(143,191,95,0.8)"/><rect x="865.3" y="421.8" width="5.4" height="88.2" fill="rgba(143,191,95,0.8)"/><rect x="871.9" y="423.9" width="5.4" height="86.1" fill="rgba(143,191,95,0.8)"/><rect x="878.5" y="428.1" width="5.4" height="81.9" fill="rgba(143,191,95,0.8)"/><rect x="885.1" y="432.3" width="5.4" height="77.7" fill="rgba(143,191,95,0.8)"/><rect x="891.6" y="434.4" width="5.4" height="75.6" fill="rgba(143,191,95,0.8)"/><rect x="898.2" y="438.6" width="5.4" height="71.4" fill="rgba(143,191,95,0.8)"/><rect x="904.8" y="442.8" width="5.4" height="67.2" fill="rgba(143,191,95,0.8)"/><rect x="911.4" y="447.0" width="5.4" height="63.0" fill="rgba(143,191,95,0.8)"/><rect x="918.0" y="449.1" width="5.4" height="60.9" fill="rgba(143,191,95,0.8)"/><rect x="924.6" y="453.3" width="5.4" height="56.7" fill="rgba(143,191,95,0.8)"/><rect x="931.2" y="457.5" width="5.4" height="52.5" fill="rgba(143,191,95,0.8)"/><rect x="937.8" y="459.6" width="5.4" height="50.4" fill="rgba(143,191,95,0.8)"/><rect x="944.4" y="463.8" width="5.4" height="46.2" fill="rgba(143,191,95,0.8)"/><rect x="950.9" y="468.0" width="5.4" height="42.0" fill="rgba(143,191,95,0.8)"/><rect x="957.5" y="470.1" width="5.4" height="39.9" fill="rgba(143,191,95,0.8)"/><rect x="964.1" y="474.3" width="5.4" height="35.7" fill="rgba(143,191,95,0.8)"/><rect x="970.7" y="478.5" width="5.4" height="31.5" fill="rgba(143,191,95,0.8)"/><rect x="977.3" y="480.6" width="5.4" height="29.4" fill="rgba(143,191,95,0.8)"/><rect x="983.9" y="484.8" width="5.4" height="25.2" fill="rgba(143,191,95,0.8)"/><rect x="990.5" y="489.0" width="5.4" height="21.0" fill="rgba(143,191,95,0.8)"/><rect x="997.1" y="493.2" width="5.4" height="16.8" fill="rgba(143,191,95,0.8)"/><rect x="1003.6" y="495.3" width="5.4" height="14.7" fill="rgba(143,191,95,0.8)"/><rect x="1010.2" y="499.5" width="5.4" height="10.5" fill="rgba(143,191,95,0.8)"/><rect x="1016.8" y="503.7" width="5.4" height="6.3" fill="rgba(143,191,95,0.8)"/><rect x="1023.4" y="505.8" width="5.4" height="4.2" fill="rgba(143,191,95,0.8)"/>
  <line x1="470" y1="512" x2="1030" y2="512" stroke="#463620"/>
  <line x1="638.0" y1="288" x2="638.0" y2="522" stroke="#8a7a5f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="638" y="538" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#8a7a5f">↑ price at open</text>
  <text x="470" y="564" text-anchor="start" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#cf9440">← 25 bins of bids (WETH)</text>
  <text x="1030" y="564" text-anchor="end" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#8fbf5f">59 bins of asks (token) →</text>
  <text x="470" y="594" text-anchor="start" font-family="IBM Plex Sans" font-size="18" font-weight="400" fill="#ece3d2">one record on-chain: owner · pool key · every bin</text>
  <text x="470" y="620" text-anchor="start" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#8a7a5f">each bin's salt = keccak256(positionId, binIndex),</text>
  <text x="470" y="642" text-anchor="start" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#8a7a5f">which namespaces it to this position and owner</text>

  <line x1="1044" y1="405" x2="1076" y2="405" stroke="#cf9440" stroke-width="2"/>
  <polygon points="1084,405 1073,399 1073,411" fill="#cf9440"/>
  <text x="1060" y="391" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#8a7a5f">85 mints</text>
  <text x="1060" y="431" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#8fbf5f">one tx</text>

  <!-- 3. what Uniswap sees -->
  <text x="1090" y="276" text-anchor="start" font-family="IBM Plex Mono" font-size="21" font-weight="400" fill="#8fbf5f">what Uniswap v4 sees</text>
  <rect x="1090" y="286" width="446" height="42" rx="10" fill="#181209" stroke="#2a2012" stroke-width="1.5"/>
    <text x="1104" y="313" text-anchor="start" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#cf9440">bin 84</text>
    <text x="1186" y="313" text-anchor="start" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#ece3d2">144000 → 144160</text>
    <text x="1522" y="313" text-anchor="end" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8a7a5f">0x2884…c312</text><rect x="1090" y="337" width="446" height="42" rx="10" fill="#181209" stroke="#2a2012" stroke-width="1.5"/>
    <text x="1104" y="364" text-anchor="start" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#cf9440">bin 83</text>
    <text x="1186" y="364" text-anchor="start" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#ece3d2">144160 → 144320</text>
    <text x="1522" y="364" text-anchor="end" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8a7a5f">0x42b5…81c5</text><rect x="1090" y="388" width="446" height="42" rx="10" fill="#181209" stroke="#2a2012" stroke-width="1.5"/>
    <text x="1104" y="415" text-anchor="start" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#cf9440">bin 59</text>
    <text x="1186" y="415" text-anchor="start" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#ece3d2">148000 → 148160</text>
    <text x="1522" y="415" text-anchor="end" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8a7a5f">0x2540…72b0</text><text x="1313" y="465" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5d5138">· · ·  81 more bins  · · ·</text><rect x="1090" y="490" width="446" height="42" rx="10" fill="#181209" stroke="#2a2012" stroke-width="1.5"/>
    <text x="1104" y="517" text-anchor="start" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#cf9440">bin 57</text>
    <text x="1186" y="517" text-anchor="start" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#ece3d2">157440 → 157600</text>
    <text x="1522" y="517" text-anchor="end" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8a7a5f">0x7fdb…7548</text>
  <text x="1090" y="567" text-anchor="start" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#8a7a5f">One per bin, so 85 here.</text>
  <text x="1090" y="591" text-anchor="start" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#8a7a5f">Owner is the manager; ticks + salt</text>
  <text x="1090" y="613" text-anchor="start" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#8a7a5f">identify each one.</text>
  <text x="1090" y="643" text-anchor="start" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#8fbf5f">fees accrue per bin, separately</text>

  <!-- the reverse -->
  <rect x="64" y="728" width="1472" height="66" rx="10" fill="#181209" stroke="#2a2012" stroke-width="1.5"/>
  <text x="88" y="769" text-anchor="start" font-family="IBM Plex Mono" font-size="19" font-weight="400" fill="#cf9440">close()</text>
  <text x="180" y="769" text-anchor="start" font-family="IBM Plex Sans" font-size="19" font-weight="400" fill="#ece3d2">burns every bin, collects all their fees, and pays out once. One call out, same as one call in.</text>

  <line x1="64" y1="826" x2="1536" y2="826" stroke="#2a2012" stroke-width="1"/>
  <text x="64" y="864" text-anchor="start" font-family="IBM Plex Mono" font-size="22" font-weight="400" fill="#cf9440" letter-spacing="2">friar.fi</text>
  <text x="1536" y="864" text-anchor="end" font-family="IBM Plex Mono" font-size="19" font-weight="400" fill="#5d5138">Robinhood Chain · 4663</text>
</svg>