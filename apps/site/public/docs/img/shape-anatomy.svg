<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#100c07"/>

  <text x="64" y="78" text-anchor="start" font-family="IBM Plex Mono" font-size="32" font-weight="600" fill="#cf9440" letter-spacing="9">FRIAR</text>
  <text x="1536" y="76" text-anchor="end" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#8a7a5f" letter-spacing="3">ANATOMY OF A SHAPED POSITION</text>
  <line x1="64" y1="108" x2="1536" y2="108" stroke="#2a2012" stroke-width="1"/>
  <text x="64" y="172" text-anchor="start" font-family="IBM Plex Sans" font-size="44" font-weight="600" fill="#ece3d2">One position, one Uniswap position per bin</text>
  <text x="64" y="214" text-anchor="start" font-family="IBM Plex Sans" font-size="21" font-weight="400" fill="#8a7a5f">You choose the range, the shape, and how many bins to spread across, up to 100. The manager</text>
  <text x="64" y="242" text-anchor="start" font-family="IBM Plex Sans" font-size="21" font-weight="400" fill="#8a7a5f">mints one v4 LP position per bin in a single transaction. The example below uses 85.</text>

  <!-- 1. what you do in the app -->
  <rect x="64" y="286" width="340" height="246" rx="10" fill="#211910" stroke="#463620" stroke-width="1.5"/>
  <text x="84" y="320" text-anchor="start" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#8a7a5f" letter-spacing="2">YOU CHOOSE</text>
  <text x="84" y="356" text-anchor="start" font-family="IBM Plex Sans" font-size="19" font-weight="400" fill="#8a7a5f">shape</text>
  <text x="384" y="356" text-anchor="end" font-family="IBM Plex Mono" font-size="19" font-weight="400" fill="#ece3d2">Curve</text>
  <text x="84" y="386" text-anchor="start" font-family="IBM Plex Sans" font-size="19" font-weight="400" fill="#8a7a5f">range</text>
  <text x="384" y="386" text-anchor="end" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#ece3d2">144000 → 157600</text>
  <text x="84" y="416" text-anchor="start" font-family="IBM Plex Sans" font-size="19" font-weight="400" fill="#8a7a5f">bins</text>
  <text x="384" y="416" text-anchor="end" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#cf9440">85 · up to 100</text>
  <text x="84" y="446" text-anchor="start" font-family="IBM Plex Sans" font-size="19" font-weight="400" fill="#8a7a5f">bin width</text>
  <text x="384" y="446" text-anchor="end" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#ece3d2">160 ticks · 1.6%</text>
  <text x="84" y="476" text-anchor="start" font-family="IBM Plex Sans" font-size="19" font-weight="400" fill="#8a7a5f">deposit</text>
  <text x="384" y="476" text-anchor="end" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#ece3d2">0.18 WETH</text>
  <line x1="84" y1="494" x2="384" y2="494" stroke="#2a2012"/>
  <text x="234" y="518" text-anchor="middle" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#8fbf5f">one signature</text>

  <!-- arrow into the manager -->
  <line x1="412" y1="398" x2="454" y2="398" stroke="#cf9440" stroke-width="2"/>
  <polygon points="462,398 451,392 451,404" fill="#cf9440"/>

  <!-- 2. the manager: the shape it computes -->
  <text x="470" y="276" text-anchor="start" font-family="IBM Plex Mono" font-size="21" font-weight="400" fill="#cf9440">FriarPositionManager</text>
  <rect x="470.0" y="501.6" width="5.4" height="8.4" fill="rgba(207,148,64,0.85)"/><rect x="476.6" y="493.2" width="5.4" height="16.8" fill="rgba(207,148,64,0.85)"/><rect x="483.2" y="484.8" width="5.4" height="25.2" fill="rgba(207,148,64,0.85)"/><rect x="489.8" y="478.5" width="5.4" height="31.5" fill="rgba(207,148,64,0.85)"/><rect x="496.4" y="470.1" width="5.4" height="39.9" fill="rgba(207,148,64,0.85)"/><rect x="502.9" y="461.7" width="5.4" height="48.3" fill="rgba(207,148,64,0.85)"/><rect x="509.5" y="453.3" width="5.4" height="56.7" fill="rgba(207,148,64,0.85)"/><rect x="516.1" y="444.9" width="5.4" height="65.1" fill="rgba(207,148,64,0.85)"/><rect x="522.7" y="436.5" width="5.4" height="73.5" fill="rgba(207,148,64,0.85)"/><rect x="529.3" y="430.2" width="5.4" height="79.8" fill="rgba(207,148,64,0.85)"/><rect x="535.9" y="421.8" width="5.4" height="88.2" fill="rgba(207,148,64,0.85)"/><rect x="542.5" y="413.4" width="5.4" height="96.6" fill="rgba(207,148,64,0.85)"/><rect x="549.1" y="405.0" width="5.4" height="105.0" fill="rgba(207,148,64,0.85)"/><rect x="555.6" y="396.6" width="5.4" height="113.4" fill="rgba(207,148,64,0.85)"/><rect x="562.2" y="388.2" width="5.4" height="121.8" fill="rgba(207,148,64,0.85)"/><rect x="568.8" y="381.9" width="5.4" height="128.1" fill="rgba(207,148,64,0.85)"/><rect x="575.4" y="373.5" width="5.4" height="136.5" fill="rgba(207,148,64,0.85)"/><rect x="582.0" y="365.1" width="5.4" height="144.9" fill="rgba(207,148,64,0.85)"/><rect x="588.6" y="356.7" width="5.4" height="153.3" fill="rgba(207,148,64,0.85)"/><rect x="595.2" y="348.3" width="5.4" height="161.7" fill="rgba(207,148,64,0.85)"/><rect x="601.8" y="339.9" width="5.4" height="170.1" fill="rgba(207,148,64,0.85)"/><rect x="608.4" y="331.5" width="5.4" height="178.5" fill="rgba(207,148,64,0.85)"/><rect x="614.9" y="325.2" width="5.4" height="184.8" fill="rgba(207,148,64,0.85)"/><rect x="621.5" y="316.8" width="5.4" height="193.2" fill="rgba(207,148,64,0.85)"/><rect x="628.1" y="